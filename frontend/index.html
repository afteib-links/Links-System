<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Links-System 運送業務基幹システム</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Links-System</h1>
    <div id="user-box" class="user-box hidden">
      <span id="user-name"></span>
      <button id="logout-btn" type="button">ログアウト</button>
    </div>
  </header>

  <main class="container">
    <!-- ログイン画面 -->
    <section id="login-view" class="card">
      <h2>ログイン</h2>
      <form id="login-form">
        <label>ID
          <input type="text" id="login-id" autocomplete="username" required />
        </label>
        <label>パスワード
          <input type="password" id="login-password" autocomplete="current-password" required />
        </label>
        <button type="submit">ログイン</button>
      </form>
      <p id="login-error" class="error"></p>
    </section>

    <!-- 企業マスタ管理画面 -->
    <section id="companies-view" class="hidden">
      <div class="card">
        <h2>企業マスタ 新規登録</h2>
        <form id="company-form">
          <label>企業名 <input type="text" id="company-name" required /></label>
          <label>締日
            <select id="company-closing-day">
              <option value="末日">末日</option>
              <option value="20日">20日</option>
              <option value="15日">15日</option>
              <option value="5日">5日</option>
            </select>
          </label>
          <label>請求書送付方法 <input type="text" id="company-invoice" placeholder="郵送 / メール 等" /></label>
          <label>振込期日 <input type="text" id="company-payment-due" placeholder="翌月末 等" /></label>
          <button type="submit">登録</button>
        </form>
        <p id="company-error" class="error"></p>
      </div>

      <div class="card">
        <h2>企業マスタ 一覧</h2>
        <table id="companies-table">
          <thead>
            <tr><th>ID</th><th>企業名</th><th>締日</th><th>請求書送付</th><th>振込期日</th><th>版</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
