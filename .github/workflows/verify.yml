name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  syntax-and-migration-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Check JavaScript syntax
        run: |
          find backend/src frontend/js scripts -type f -name '*.js' -print0 \
            | xargs -0 -r -n1 node --check

      - name: Check migration sequence
        shell: bash
        run: |
          set -euo pipefail
          expected=1
          while IFS= read -r path; do
            name="$(basename "$path")"
            number="${name%%_*}"
            expected_padded="$(printf '%03d' "$expected")"
            test "$number" = "$expected_padded"
            expected=$((expected + 1))
          done < <(find db/migrations -maxdepth 1 -type f -name '*.sql' | sort)
