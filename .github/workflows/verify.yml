name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  syntax-and-migration-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Check JavaScript syntax
        run: |
          find backend/src frontend/js scripts -type f -name '*.js' -print0 \
            | xargs -0 -r -n1 node --check

      - name: Run backend unit tests
        run: npm test --prefix backend

      - name: Check migration sequence
        shell: bash
        run: |
          set -euo pipefail
          expected=1
          while IFS= read -r path; do
            name="$(basename "$path")"
            number="${name%%_*}"
            expected_padded="$(printf '%03d' "$expected")"
            test "$number" = "$expected_padded"
            expected=$((expected + 1))
          done < <(find db/migrations -maxdepth 1 -type f -name '*.sql' | sort)

  mariadb-migration-and-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: links_ci_root
          MARIADB_DATABASE: links_system
          MARIADB_USER: links
          MARIADB_PASSWORD: links_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: links_system
      DB_USER: links
      DB_PASSWORD: links_ci_password
      SESSION_SECRET: links_ci_session_secret
      ADMIN_LOGIN_ID: ci-admin
      ADMIN_PASSWORD: ci-admin-password
      ADMIN_DISPLAY_NAME: CI管理者
      APP_PORT: 3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install Chromium for UI test
        working-directory: backend
        run: npx playwright install --with-deps chromium

      - name: Apply all migrations and seed
        run: npm run migrate --prefix backend

      - name: Verify Issue 33 schema
        run: node backend/test-integration/verify_migration_013.js

      - name: Verify migration re-run
        run: npm run migrate --prefix backend

      - name: Run daily report API integration
        run: node backend/test-integration/daily_report_api.js

      - name: Run holiday selection integration
        run: node backend/test-integration/holiday_api.js

      - name: Run daily report browser E2E
        run: npm run test:e2e --prefix backend

      - name: Upload daily report E2E screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-e2e-screenshot
          path: backend/test-results/*.png
          if-no-files-found: ignore

      - name: Start API and verify health
        shell: bash
        run: |
          set -euo pipefail
          npm start --prefix backend > /tmp/links-system-api.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; cat /tmp/links-system-api.log' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health \
              | grep -q '"db":"up"'; then
              exit 0
            fi
            sleep 1
          done
          echo 'API health check timed out' >&2
          exit 1
