<!-- 新規案件作成モーダル -->
<div class="modal-overlay hidden" id="addProjectModal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">新規案件作成</h3>
      <button class="modal-close" onclick="closeModal('addProjectModal')">&times;</button>
    </div>
    <form id="addProjectForm" onsubmit="handleSaveProject(event)">
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">案件名 <span style="color:var(--color-danger)">*</span></label>
          <input type="text" class="form-control" id="formPrjName" placeholder="例: 神奈川エリアルート配送便" required>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">発注元企業 <span style="color:var(--color-danger)">*</span></label>
            <select class="form-control" id="formPrjCompany" required>
              <option value="">選択してください</option>
              <option value="株式会社ヤマト運送">株式会社ヤマト運送</option>
              <option value="佐川ロジスティクス株式会社">佐川ロジスティクス株式会社</option>
              <option value="C配送サービス">C配送サービス</option>
              <option value="山田運送">山田運送</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">担当パートナー <span style="color:var(--color-danger)">*</span></label>
            <select class="form-control" id="formPrjPartner" required>
              <option value="">選択してください</option>
              <option value="東京トランスポート">東京トランスポート</option>
              <option value="山田配送サービス">山田配送サービス</option>
              <option value="関東陸運">関東陸運</option>
              <option value="鈴木ドライバー">鈴木ドライバー</option>
              <option value="佐藤ロジテック">佐藤ロジテック</option>
              <option value="田中物流">田中物流</option>
            </select>
          </div>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">開始日 <span style="color:var(--color-danger)">*</span></label>
            <input type="date" class="form-control" id="formPrjStart" value="2026-09-01" required>
          </div>
          <div class="form-group">
            <label class="form-label">終了日 <span style="color:var(--color-danger)">*</span></label>
            <input type="date" class="form-control" id="formPrjEnd" value="2027-03-31" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">ステータス</label>
          <select class="form-control" id="formPrjStatus">
            <option value="稼働中" selected>稼働中</option>
            <option value="停止">停止</option>
            <option value="完了">完了</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">業務内容・運行条件</label>
          <textarea class="form-control" id="formPrjWork" rows="3" placeholder="配車の条件、車両区分、積み下ろし指示などを記入"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">備考</label>
          <textarea class="form-control" id="formPrjNote" rows="2" placeholder="注意事項、契約条件メモ"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" onclick="closeModal('addProjectModal')">キャンセル</button>
        <button type="submit" class="btn btn-primary">登録する</button>
      </div>
    </form>
  </div>

  function getLayout() {
    return DT.loadLayout(SCREEN_KEY) || DEFAULT_LAYOUT;
  }

  function statusBadgeHtml(status) {
    if (status === '稼働中') return '<span class="badge badge-green">稼働中</span>';
    if (status === '完了') return '<span class="badge badge-gray">完了</span>';
    return '<span class="badge badge-red">停止</span>';
  }

  function renderProjectList() {
    const rows = Object.values(projects);
    const table = DT.renderTable({
      screenKey: SCREEN_KEY,
      columns: COLUMN_CATALOG,
      rows,
      layout: getLayout(),
      sortKey: listState.sortKey,
      sortOrder: listState.sortOrder,
      filters: listState.filters,
      tableId: 'projectTable',
      renderHtml: (row, col) => {
        if (col.key === 'project_no') {
          return `<span class="project-no">${DT.escapeHtml(row.project_no)}</span>`;
        }
        if (col.key === 'project_name') {
          return `<strong>${DT.escapeHtml(row.project_name)}</strong>`;
        }
        if (col.key === 'status') {
          return statusBadgeHtml(row.status);
        }
        return null;
      },
      renderActions: (row) => `
        <button type="button" class="btn btn-outline btn-sm" onclick="showProjectDetail('${DT.escapeHtml(row.project_no)}')">詳細</button>
        <button type="button" class="btn btn-ghost btn-sm" onclick="editProject('${DT.escapeHtml(row.project_no)}')">編集</button>`,
    });

    document.getElementById('projects-list-root').innerHTML = table.html;
    document.getElementById('recordCount').textContent = String(table.filteredRows.length);
    DT.bindTable('#projects-list-root', {
      onSort: (key) => {
        if (listState.sortKey === key) {
          listState.sortOrder = listState.sortOrder === 'asc' ? 'desc' : 'asc';
        } else {
          listState.sortKey = key;
          listState.sortOrder = 'asc';
        }
        renderProjectList();
      },
      onFilter: (filters) => {
        listState.filters = filters;
        renderProjectList();
      },
    });
  }

  /** 企業／パートナー管理からの遷移: query で列フィルタをセット */
  function applyCompanyQueryFilter() {
    const params = new URLSearchParams(location.search);
    const companyName = params.get('company_name');
    const partnerName = params.get('partner_name');
    if (!companyName && !partnerName) return;

    if (companyName) listState.filters.company_name = companyName;
    if (partnerName) listState.filters.partner_name = partnerName;

    const bannerHost = document.getElementById('queryFilterBanner');
    if (bannerHost && !document.getElementById('companyFilterBanner')) {
      const parts = [];
      if (companyName) {
        parts.push(`企業「<strong>${DT.escapeHtml(companyName)}</strong>」`);
      }
      if (partnerName) {
        parts.push(`パートナー「<strong>${DT.escapeHtml(partnerName)}</strong>」`);
      }
      const banner = document.createElement('div');
      banner.id = 'companyFilterBanner';
      banner.className = 'alert alert-info';
      banner.style.marginBottom = '12px';
      banner.innerHTML = `${parts.join(' / ')}で絞り込み中（他画面からの遷移）
        <a href="03_company.html" style="margin-left:12px;">企業管理へ戻る</a>
        <a href="06_project.html" style="margin-left:8px;">絞り込み解除</a>`;
      bannerHost.appendChild(banner);
    }
  }

  function openAddProjectModal() {
    document.getElementById('addProjectForm').reset();
    document.getElementById('formPrjStart').value = '2026-09-01';
    document.getElementById('formPrjEnd').value = '2027-03-31';
    document.getElementById('formPrjStatus').value = '稼働中';
    openModal('addProjectModal');
  }

  function handleSaveProject(e) {
    e.preventDefault();
    const name = document.getElementById('formPrjName').value.trim();
    const company = document.getElementById('formPrjCompany').value;
    const partner = document.getElementById('formPrjPartner').value;
    if (!name || !company || !partner) {
      alert('必須項目を入力してください。');
      return;
    }
    const seq = Object.keys(projects).length + 1;
    const no = `PRJ-202608-${String(seq).padStart(3, '0')}`;
    const startRaw = document.getElementById('formPrjStart').value;
    const endRaw = document.getElementById('formPrjEnd').value;
    projects[no] = {
      id: no,
      project_no: no,
      project_name: name,
      company_name: company,
      company_user: '-',
      partner_name: partner,
      partner_user: '-',
      start_date: startRaw ? startRaw.replace(/-/g, '/') : '',
      end_date: endRaw ? endRaw.replace(/-/g, '/') : '',
      status: document.getElementById('formPrjStatus').value,
      work: document.getElementById('formPrjWork').value,
      note: document.getElementById('formPrjNote').value,
    };
    closeModal('addProjectModal');
    document.getElementById('addProjectForm').reset();
    renderProjectList();
    showToast('新しい案件を登録しました', 'success');
  }

  function showProjectDetail(no) {
    const p = projects[no];
    if (!p) return;
    document.getElementById('detailPrjNo').value = p.project_no;
    document.getElementById('detailPrjName').value = p.project_name;
    document.getElementById('detailCompany').value = p.company_name;
    document.getElementById('detailCompanyUser').value = p.company_user || '-';
    document.getElementById('detailPartner').value = p.partner_name;
    document.getElementById('detailPartnerUser').value = p.partner_user || '-';
    document.getElementById('detailStartDate').value = p.start_date;
    document.getElementById('detailEndDate').value = p.end_date;
    document.getElementById('detailWork').value = p.work || '';
    document.getElementById('detailNote').value = p.note || '';
    document.getElementById('detailPrjStatusBadge').innerHTML = statusBadgeHtml(p.status);
    openModal('projectDetailModal');
  }

  function editProject(no) {
    const p = projects[no];
    if (!p) return;
    showToast(`「${p.project_name}」の編集モードを起動しました`, 'info');
  }

  function goToPriceMaster() {
    closeModal('projectDetailModal');
    location.href = '07_price_master.html';
  }

  document.addEventListener('DOMContentLoaded', () => {
    if (!DT.loadLayout(SCREEN_KEY)) {
      DT.saveLayout(SCREEN_KEY, DEFAULT_LAYOUT);
    }
    applyCompanyQueryFilter();
    renderProjectList();
  });
</script>
</body>
</html>
