<style>
  .partner-no {
    font-family: monospace;
    font-weight: 600;
    color: #7c3aed;
    background: #f3e8ff;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 12px;
  }
  .section-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--color-text);
    margin: 20px 0 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--color-border);
  }
  .section-title:first-child { margin-top: 0; }
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 20px 0 12px;
  }
  .section-head .section-title {
    margin: 0;
    border: none;
    padding: 0;
  }
  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px 16px;
  }
  .form-grid .full { grid-column: 1 / -1; }
  .form-grid label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--color-text-muted);
    margin-bottom: 4px;
  }
  .form-grid .check-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 500;
    color: var(--color-text);
    cursor: pointer;
  }
  .form-grid .check-item input { width: 16px; height: 16px; accent-color: var(--color-primary); }
  .detail-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--color-border);
  }
  .page-header-left {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .ins-badge {
    display: inline-block;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 4px;
    background: #f1f5f9;
    color: var(--color-text);
    margin: 1px 2px 1px 0;
    white-space: nowrap;
  }
  @media (max-width: 720px) {
    .form-grid { grid-template-columns: 1fr; }
  }
</style>
</head>

<!-- メインコンテンツ -->
<div class="main-content">

  <!-- 一覧パネル -->
  <div id="panel-list">
    <header class="page-header">
      <h1 class="page-title">パートナー管理</h1>
      <button type="button" class="btn btn-primary" onclick="openNewPartner()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        新規パートナー登録
      </button>
    </header>
    <div class="page-body">
      <div class="list-meta">
        <span>該当件数: <strong id="recordCount">0</strong> 件</span>
        <span>表示列・順序は UIビルダーで変更（本システムの <code>user_screen_layouts</code> 相当。この画面に列操作UIは置かない）</span>
      </div>
      <div id="partners-list-root"></div>
    </div>
  </div>

  <!-- 詳細・編集パネル（フルページ） -->
  <div id="panel-detail" class="hidden">
    <header class="page-header">
      <div class="page-header-left">
        <button type="button" class="btn btn-outline" onclick="showListPanel()">← 一覧へ戻る</button>
        <h1 class="page-title" id="detailTitle">パートナー編集</h1>
      </div>
      <div class="flex gap-2">
        <button type="button" class="btn btn-outline" id="detailGoProjectsBtn" onclick="goProjectsFromDetail()">案件一覧</button>
      </div>
    </header>
    <div class="page-body">
      <form id="partnerForm" onsubmit="event.preventDefault(); savePartner();">
        <h3 class="section-title">基本情報</h3>
        <div class="form-grid mb-4">
          <div>
            <label>パートナーNo</label>
            <input type="text" class="form-control" name="partner_id" id="f_partner_id" readonly>
          </div>
          <div>
            <label>名称（必須）</label>
            <input type="text" class="form-control" name="partner_name" id="f_partner_name" required placeholder="例: 山田 太郎">
          </div>
          <div>
            <label>カナ</label>
            <input type="text" class="form-control" name="partner_name_kana" id="f_partner_name_kana" placeholder="ヤマダ タロウ">
          </div>
          <div>
            <label>郵便番号</label>
            <input type="text" class="form-control" name="zip_code" id="f_zip_code" placeholder="160-0023">
          </div>
          <div class="full">
            <label>住所</label>
            <input type="text" class="form-control" name="address" id="f_address" placeholder="東京都新宿区…">
          </div>
          <div>
            <label>電話</label>
            <input type="text" class="form-control" name="contact_phone" id="f_contact_phone" placeholder="090-0000-0000">
          </div>
          <div>
            <label>血液型</label>
            <input type="text" class="form-control" name="blood_type" id="f_blood_type" placeholder="A">
          </div>
          <div>
            <label>生年月日</label>
            <input type="date" class="form-control" name="birth_date" id="f_birth_date">
          </div>
          <div>
            <label>稼働開始日</label>
            <input type="date" class="form-control" name="work_start_date" id="f_work_start_date">
          </div>
          <div>
            <label>契約日</label>
            <input type="date" class="form-control" name="contract_date" id="f_contract_date">
          </div>
          <div>
            <label>区分</label>
            <select class="form-control" name="partner_category_code" id="f_partner_category_code">
              <option value="">（未選択）</option>
              <option value="individual">個人</option>
              <option value="company">企業</option>
              <option value="sole_proprietor">個人事業主</option>
            </select>
          </div>
          <div>
            <label>雇用区分</label>
            <select class="form-control" name="employment_type_code" id="f_employment_type_code">
              <option value="">（未選択）</option>
              <option value="outsourcing">外注</option>
              <option value="payroll">給与</option>
            </select>
          </div>
          <div>
            <label>インボイス番号</label>
            <input type="text" class="form-control" name="invoice_number" id="f_invoice_number" placeholder="T1234567890123">
          </div>
          <div class="full">
            <label class="check-item">
              <input type="checkbox" name="advance_payment_enabled" id="f_advance_payment_enabled">
              <span>先払い対象</span>
            </label>
          </div>
        </div>

        <h3 class="section-title">免許・各種区分・銀行</h3>
        <div class="form-grid mb-4">
          <div>
            <label>免許期限</label>
            <input type="date" class="form-control" name="license_expiry_date" id="f_license_expiry_date">
          </div>
          <div class="full">
            <label>免許種類</label>
            <input type="text" class="form-control" name="license_types" id="f_license_types" placeholder="普通・準中型 など">
          </div>
          <div class="full">
            <label>安全大会履歴</label>
            <textarea class="form-control" name="safety_conference_history" id="f_safety_conference_history" rows="2" placeholder="受講履歴など"></textarea>
          </div>
          <div>
            <label>傷害保険</label>
            <select class="form-control" name="accident_insurance_code" id="f_accident_insurance_code">
              <option value="">（未選択）</option>
              <option value="joined">加入</option>
              <option value="not_joined">未加入</option>
            </select>
          </div>
          <div>
            <label>請負賠償</label>
            <select class="form-control" name="contractor_liability_code" id="f_contractor_liability_code">
              <option value="">（未選択）</option>
              <option value="joined">加入</option>
              <option value="not_joined">未加入</option>
            </select>
          </div>
          <div>
            <label>貨物保険</label>
            <select class="form-control" name="cargo_insurance_code" id="f_cargo_insurance_code">
              <option value="">（未選択）</option>
              <option value="joined">加入</option>
              <option value="not_joined">未加入</option>
            </select>
          </div>
          <div>
            <label>G会</label>
            <select class="form-control" name="g_association_code" id="f_g_association_code">
              <option value="">（未選択）</option>
              <option value="joined">加入</option>
              <option value="not_joined">未加入</option>
            </select>
          </div>
          <div>
            <label>確定申告</label>
            <select class="form-control" name="tax_return_code" id="f_tax_return_code">
              <option value="">（未選択）</option>
              <option value="done">提出済</option>
              <option value="not_done">未提出</option>
            </select>
          </div>
          <div>
            <label>ループ</label>
            <select class="form-control" name="loop_code" id="f_loop_code">
              <option value="">（未選択）</option>
              <option value="yes">有</option>
              <option value="no">無</option>
            </select>
          </div>
          <div>
            <label>支払出力</label>
            <select class="form-control" name="payment_output_code" id="f_payment_output_code">
              <option value="">（未選択）</option>
              <option value="type_a">帳票A</option>
              <option value="type_b">帳票B</option>
              <option value="type_c">帳票C</option>
            </select>
          </div>
          <div>
            <label>銀行名</label>
            <input type="text" class="form-control" name="bank_name" id="f_bank_name" placeholder="三菱UFJ銀行">
          </div>
          <div>
            <label>支店名</label>
            <input type="text" class="form-control" name="branch_name" id="f_branch_name" placeholder="新宿支店">
          </div>
          <div>
            <label>口座種別</label>
            <select class="form-control" name="deposit_type" id="f_deposit_type">
              <option value="">（未選択）</option>
              <option value="ordinary">普通</option>
              <option value="checking">当座</option>
              <option value="savings">貯蓄</option>
            </select>
          </div>
          <div>
            <label>口座番号</label>
            <input type="text" class="form-control" name="account_number" id="f_account_number" placeholder="1234567">
          </div>
          <div>
            <label>口座名義</label>
            <input type="text" class="form-control" name="account_name" id="f_account_name" placeholder="ヤマダ タロウ">
          </div>
        </div>

        <div class="section-head">
          <h3 class="section-title">車両</h3>
          <button type="button" class="btn btn-outline btn-sm" onclick="openVehicleModal(null)">＋ 車両追加</button>
        </div>
        <div class="table-wrap mb-4" id="vehicles-mini"></div>

        <div class="detail-actions">
          <button type="submit" class="btn btn-primary">保存する</button>
          <button type="button" class="btn btn-outline" onclick="showListPanel()">一覧へ</button>
          <button type="button" class="btn btn-ghost" id="detailDeleteBtn" style="color: var(--color-danger);" onclick="deleteFromDetail()">削除</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- 車両追加・編集モーダル -->
<div class="modal-overlay hidden" id="vehicleModal">
  <div class="modal" style="max-width: 520px;">
    <div class="modal-header">
      <h3 class="modal-title" id="vehicleModalTitle">車両追加</h3>
      <button type="button" class="modal-close" onclick="closeModal('vehicleModal')">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div>
          <label>車両名称</label>
          <input type="text" class="form-control" id="m_vehicle_name" placeholder="軽バン">
        </div>
        <div>
          <label>車両番号</label>
          <input type="text" class="form-control" id="m_vehicle_number" placeholder="足立 480 あ 12-34">
        </div>
        <div>
          <label>車検期限</label>
          <input type="date" class="form-control" id="m_inspection">
        </div>
        <div>
          <label>保険期限</label>
          <input type="date" class="form-control" id="m_insurance">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-outline" onclick="closeModal('vehicleModal')">キャンセル</button>
      <button type="button" class="btn btn-primary" onclick="saveVehicleModal()">保存</button>
    </div>
  </div>
</div>

  function formatDate(v) {
    if (!v) return '';
    return String(v).slice(0, 10);
  }

  function calcContinuityYears(workStartDate) {
    const d = formatDate(workStartDate);
    if (!d) return 0;
    const start = new Date(d);
    if (Number.isNaN(start.getTime())) return 0;
    const now = new Date();
    let years = now.getFullYear() - start.getFullYear();
    const m = now.getMonth() - start.getMonth();
    if (m < 0 || (m === 0 && now.getDate() < start.getDate())) years -= 1;
    return Math.max(0, years);
  }

  function insuranceBadge(map, value, label) {
    if (!value) return '';
    const text = map[value];
    if (!text) return '';
    return `${label}:${text}`;
  }

  function insuranceBadgesText(p) {
    return [
      insuranceBadge(CODE_LABELS.accident_insurance, p.accident_insurance_code, '傷害'),
      insuranceBadge(CODE_LABELS.contractor_liability, p.contractor_liability_code, '請負'),
      insuranceBadge(CODE_LABELS.cargo_insurance, p.cargo_insurance_code, '貨物'),
      insuranceBadge(CODE_LABELS.g_association, p.g_association_code, 'G会'),
    ]
      .filter(Boolean)
      .join(' / ') || '-';
  }

  function enrichRow(p) {
    return {
      ...p,
      id: p.partner_id,
      continuity_years: calcContinuityYears(p.work_start_date),
      license_expiry: formatDate(p.license_expiry_date) || '-',
      bank: [p.bank_name, p.branch_name].filter(Boolean).join(' ') || '-',
      insurance_badges: insuranceBadgesText(p),
      project_count: p.project_count ?? 0,
      active_project_count: p.active_project_count ?? 0,
    };
  }

  function getLayout() {
    return DT.loadLayout(SCREEN_KEY) || DEFAULT_LAYOUT;
  }

  function showListPanel() {
    currentEditId = null;
    detailVehicles = [];
    document.getElementById('panel-detail').classList.add('hidden');
    document.getElementById('panel-list').classList.remove('hidden');
    renderPartnerList();
  }

  function showDetailPanel() {
    document.getElementById('panel-list').classList.add('hidden');
    document.getElementById('panel-detail').classList.remove('hidden');
  }

  function renderPartnerList() {
    const rows = Object.values(partners).map(enrichRow);
    const table = DT.renderTable({
      screenKey: SCREEN_KEY,
      columns: COLUMN_CATALOG,
      rows,
      layout: getLayout(),
      sortKey: listState.sortKey,
      sortOrder: listState.sortOrder,
      filters: listState.filters,
      tableId: 'partnerTable',
      renderHtml: (row, col) => {
        if (col.key === 'partner_id') {
          return `<span class="partner-no">${DT.escapeHtml(String(row.partner_id))}</span>`;
        }
        if (col.key === 'partner_name') {
          return `<div class="font-bold">${DT.escapeHtml(row.partner_name)}</div>
            <div class="text-sm text-muted">${DT.escapeHtml(row.partner_name_kana || '')}</div>`;
        }
        if (col.key === 'insurance_badges') {
          const text = insuranceBadgesText(row);
          if (text === '-') return '-';
          return text
            .split(' / ')
            .map((t) => `<span class="ins-badge">${DT.escapeHtml(t)}</span>`)
            .join('');
        }
        if (col.key === 'project_count' || col.key === 'active_project_count') {
          const n = Number(row[col.key]) || 0;
          return `<strong>${n}</strong>`;
        }
        return null;
      },
      renderActions: (p) => `
        <button type="button" class="btn btn-outline btn-sm" onclick="openEditPartner(${p.partner_id})">編集</button>
        <button type="button" class="btn btn-ghost btn-sm" onclick="goProjects(${p.partner_id})">案件一覧</button>
        <button type="button" class="btn btn-ghost btn-sm" style="color: var(--color-danger);" onclick="deletePartner(${p.partner_id}, '${DT.escapeHtml(p.partner_name)}')">削除</button>`,
    });

    document.getElementById('partners-list-root').innerHTML = table.html;
    document.getElementById('recordCount').textContent = String(table.filteredRows.length);
    DT.bindTable('#partners-list-root', {
      onSort: (key) => {
        if (listState.sortKey === key) {
          listState.sortOrder = listState.sortOrder === 'asc' ? 'desc' : 'asc';
        } else {
          listState.sortKey = key;
          listState.sortOrder = 'asc';
        }
        renderPartnerList();
      },
      onFilter: (filters) => {
        listState.filters = filters;
        renderPartnerList();
      },
    });
  }

  function setFormValue(id, value) {
    const el = document.getElementById(id);
    if (!el) return;
    if (el.type === 'checkbox') el.checked = !!value;
    else el.value = value == null ? '' : value;
  }

  function fillForm(p, isNew) {
    setFormValue('f_partner_id', p.partner_id);
    setFormValue('f_partner_name', p.partner_name);
    setFormValue('f_partner_name_kana', p.partner_name_kana);
    setFormValue('f_zip_code', p.zip_code);
    setFormValue('f_address', p.address);
    setFormValue('f_contact_phone', p.contact_phone);
    setFormValue('f_blood_type', p.blood_type);
    setFormValue('f_birth_date', formatDate(p.birth_date));
    setFormValue('f_work_start_date', formatDate(p.work_start_date));
    setFormValue('f_contract_date', formatDate(p.contract_date));
    setFormValue('f_partner_category_code', p.partner_category_code || '');
    setFormValue('f_employment_type_code', p.employment_type_code || '');
    setFormValue('f_invoice_number', p.invoice_number);
    setFormValue('f_advance_payment_enabled', p.advance_payment_enabled);
    setFormValue('f_license_expiry_date', formatDate(p.license_expiry_date));
    setFormValue('f_license_types', p.license_types);
    setFormValue('f_safety_conference_history', p.safety_conference_history);
    setFormValue('f_accident_insurance_code', p.accident_insurance_code || '');
    setFormValue('f_contractor_liability_code', p.contractor_liability_code || '');
    setFormValue('f_cargo_insurance_code', p.cargo_insurance_code || '');
    setFormValue('f_g_association_code', p.g_association_code || '');
    setFormValue('f_tax_return_code', p.tax_return_code || '');
    setFormValue('f_loop_code', p.loop_code || '');
    setFormValue('f_payment_output_code', p.payment_output_code || '');
    setFormValue('f_bank_name', p.bank_name);
    setFormValue('f_branch_name', p.branch_name);
    setFormValue('f_deposit_type', p.deposit_type || '');
    setFormValue('f_account_number', p.account_number);
    setFormValue('f_account_name', p.account_name);

    document.getElementById('detailTitle').textContent = isNew
      ? '新規パートナー'
      : `パートナー編集（No.${p.partner_id}）`;
    document.getElementById('detailDeleteBtn').style.display = isNew ? 'none' : '';
    document.getElementById('detailGoProjectsBtn').style.display = isNew ? 'none' : '';
  }

  function openNewPartner() {
    currentEditId = null;
    const p = emptyPartner();
    detailVehicles = [];
    fillForm(p, true);
    renderVehiclesMini();
    showDetailPanel();
  }

  function openEditPartner(id) {
    const p = partners[id];
    if (!p) return;
    currentEditId = id;
    detailVehicles = (p.vehicles || []).map((v) => ({ ...v }));
    fillForm(p, false);
    renderVehiclesMini();
    showDetailPanel();
  }

  function vehiclesTableHtml() {
    const rows = detailVehicles
      .map(
        (v, idx) => `
        <tr>
          <td>${DT.escapeHtml(v.vehicle_name || '-')}</td>
          <td>${DT.escapeHtml(v.vehicle_number || '-')}</td>
          <td>${DT.escapeHtml(formatDate(v.inspection_expiry_date) || '-')}</td>
          <td>${DT.escapeHtml(formatDate(v.insurance_expiry_date) || '-')}</td>
          <td>
            <button type="button" class="btn btn-ghost btn-sm" onclick="openVehicleModal(${idx})">編集</button>
            <button type="button" class="btn btn-ghost btn-sm" style="color: var(--color-danger);" onclick="deleteVehicle(${idx})">削除</button>
          </td>
        </tr>`
      )
      .join('');
    return `<table class="data-table data-table-compact">
      <thead><tr><th>名称</th><th>番号</th><th>車検期限</th><th>保険期限</th><th>操作</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5">車両なし</td></tr>'}</tbody>
    </table>`;
  }

  function renderVehiclesMini() {
    document.getElementById('vehicles-mini').innerHTML = vehiclesTableHtml();
  }

  function openVehicleModal(idx) {
    vehicleEditIdx = idx;
    const isNew = idx == null;
    const v = isNew
      ? { vehicle_name: '', vehicle_number: '', inspection_expiry_date: '', insurance_expiry_date: '' }
      : detailVehicles[idx];
    document.getElementById('vehicleModalTitle').textContent = isNew ? '車両追加' : '車両編集';
    document.getElementById('m_vehicle_name').value = v.vehicle_name || '';
    document.getElementById('m_vehicle_number').value = v.vehicle_number || '';
    document.getElementById('m_inspection').value = formatDate(v.inspection_expiry_date);
    document.getElementById('m_insurance').value = formatDate(v.insurance_expiry_date);
    openModal('vehicleModal');
  }

  function saveVehicleModal() {
    const row = {
      vehicle_id: vehicleEditIdx == null ? null : detailVehicles[vehicleEditIdx].vehicle_id,
      vehicle_name: document.getElementById('m_vehicle_name').value,
      vehicle_number: document.getElementById('m_vehicle_number').value,
      inspection_expiry_date: document.getElementById('m_inspection').value || '',
      insurance_expiry_date: document.getElementById('m_insurance').value || '',
    };
    if (vehicleEditIdx == null) detailVehicles.push(row);
    else detailVehicles[vehicleEditIdx] = row;
    closeModal('vehicleModal');
    renderVehiclesMini();
  }

  function deleteVehicle(idx) {
    detailVehicles.splice(idx, 1);
    renderVehiclesMini();
  }

  function readForm() {
    const id = Number(document.getElementById('f_partner_id').value);
    const prev = partners[id] || {};
    return {
      ...prev,
      partner_id: id,
      partner_name: document.getElementById('f_partner_name').value.trim(),
      partner_name_kana: document.getElementById('f_partner_name_kana').value,
      zip_code: document.getElementById('f_zip_code').value,
      address: document.getElementById('f_address').value,
      contact_phone: document.getElementById('f_contact_phone').value,
      blood_type: document.getElementById('f_blood_type').value,
      birth_date: document.getElementById('f_birth_date').value,
      work_start_date: document.getElementById('f_work_start_date').value,
      contract_date: document.getElementById('f_contract_date').value,
      partner_category_code: document.getElementById('f_partner_category_code').value,
      employment_type_code: document.getElementById('f_employment_type_code').value,
      invoice_number: document.getElementById('f_invoice_number').value,
      advance_payment_enabled: document.getElementById('f_advance_payment_enabled').checked,
      license_expiry_date: document.getElementById('f_license_expiry_date').value,
      license_types: document.getElementById('f_license_types').value,
      safety_conference_history: document.getElementById('f_safety_conference_history').value,
      accident_insurance_code: document.getElementById('f_accident_insurance_code').value,
      contractor_liability_code: document.getElementById('f_contractor_liability_code').value,
      cargo_insurance_code: document.getElementById('f_cargo_insurance_code').value,
      g_association_code: document.getElementById('f_g_association_code').value,
      tax_return_code: document.getElementById('f_tax_return_code').value,
      loop_code: document.getElementById('f_loop_code').value,
      payment_output_code: document.getElementById('f_payment_output_code').value,
      bank_name: document.getElementById('f_bank_name').value,
      branch_name: document.getElementById('f_branch_name').value,
      deposit_type: document.getElementById('f_deposit_type').value,
      account_number: document.getElementById('f_account_number').value,
      account_name: document.getElementById('f_account_name').value,
      project_count: prev.project_count ?? 0,
      active_project_count: prev.active_project_count ?? 0,
      vehicles: detailVehicles.map((v) => ({ ...v })),
    };
  }

  function savePartner() {
    const data = readForm();
    if (!data.partner_name) {
      alert('名称を入力してください。');
      return;
    }
    const isEdit = currentEditId != null && partners[currentEditId];
    partners[data.partner_id] = data;
    currentEditId = data.partner_id;
    showListPanel();
    showToast(isEdit ? 'パートナー情報を更新しました' : '新規パートナーを登録しました', 'success');
  }

  function deletePartner(id, name) {
    confirmAction(`「${name} (No.${id})」を削除してもよろしいですか？`, () => {
      delete partners[id];
      if (currentEditId === id) showListPanel();
      else renderPartnerList();
      showToast('パートナー情報を削除しました', 'info');
    });
  }

  function deleteFromDetail() {
    if (currentEditId == null || !partners[currentEditId]) return;
    const p = partners[currentEditId];
    deletePartner(p.partner_id, p.partner_name);
  }

  function goProjects(id) {
    const p = partners[id];
    if (!p) return;
    const params = new URLSearchParams({
      partner_id: String(p.partner_id),
      partner_name: p.partner_name,
    });
    location.href = `06_project.html?${params.toString()}`;
  }

  function goProjectsFromDetail() {
    if (currentEditId == null) return;
    goProjects(currentEditId);
  }

  document.addEventListener('DOMContentLoaded', () => {
    if (!DT.loadLayout(SCREEN_KEY)) {
      DT.saveLayout(SCREEN_KEY, DEFAULT_LAYOUT);
    }
    renderPartnerList();
  });
