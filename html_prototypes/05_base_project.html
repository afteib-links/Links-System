<body>

<!-- メインコンテンツ -->
<div class="main-content">
  <header class="page-header">
    <h1 class="page-title">基本案件管理 (案件テンプレート)</h1>
    <div class="flex gap-2 items-center">
      <button class="btn btn-primary" onclick="openAddTemplateModal()">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        新規テンプレート作成
      </button>
    </div>
  </header>

  <div class="page-body">
    <div id="queryFilterBanner"></div>
    <div class="list-meta">
      <span>該当件数: <strong id="recordCount">0</strong> 件</span>
      <span>表示列・順序は UIビルダーで変更（本システムの <code>user_screen_layouts</code> 相当。この画面に列操作UIは置かない）</span>
    </div>
    <div id="base-projects-list-root"></div>
  </div>
</div>

<!-- 新規テンプレート作成モーダル -->
<div class="modal-overlay hidden" id="addTemplateModal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">新規テンプレート作成</h3>
      <button class="modal-close" onclick="closeModal('addTemplateModal')">&times;</button>
    </div>
    <form id="addTemplateForm" onsubmit="handleSaveTemplate(event)">
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">テンプレート名 <span style="color:var(--color-danger)">*</span></label>
          <input type="text" class="form-control" id="formTplName" placeholder="例: 【定期便】関東エリア短距離配送パターン" required>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">発注元企業 <span style="color:var(--color-danger)">*</span></label>
            <select class="form-control" id="formTplCompany" required>
              <option value="">選択してください</option>
              <option value="株式会社ヤマト運送">株式会社ヤマト運送</option>
              <option value="佐川ロジスティクス株式会社">佐川ロジスティクス株式会社</option>
              <option value="C配送サービス">C配送サービス</option>
              <option value="山田運送">山田運送</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">担当パートナー <span style="color:var(--color-danger)">*</span></label>
            <select class="form-control" id="formTplPartner" required>
              <option value="">選択してください</option>
              <option value="東京トランスポート">東京トランスポート</option>
              <option value="山田配送サービス">山田配送サービス</option>
              <option value="関東陸運">関東陸運</option>
              <option value="鈴木ドライバー">鈴木ドライバー</option>
              <option value="佐藤ロジテック">佐藤ロジテック</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">標準期間 / 想定運用期間</label>
          <select class="form-control" id="formTplPeriod">
            <option value="1ヶ月 (スポット)">1ヶ月 (スポット)</option>
            <option value="3ヶ月">3ヶ月</option>
            <option value="6ヶ月">6ヶ月</option>
            <option value="12ヶ月 (通年)">12ヶ月 (通年)</option>
            <option value="指定なし/柔軟">指定なし/柔軟</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">作業内容・要件</label>
          <textarea class="form-control" id="formTplWork" rows="3" placeholder="配送便の概要、集荷ルート、積み下ろし条件等の共通作業内容を入力"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">備考・特記事項</label>
          <textarea class="form-control" id="formTplNote" rows="2" placeholder="注意事項、請求・支払時の適用ルール等"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" onclick="closeModal('addTemplateModal')">キャンセル</button>
        <button type="submit" class="btn btn-primary">保存する</button>
      </div>
    </form>
  </div>
</div>

<!-- テンプレート詳細モーダル -->
<div class="modal-overlay hidden" id="viewTemplateModal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">テンプレート詳細</h3>
      <button class="modal-close" onclick="closeModal('viewTemplateModal')">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">テンプレートNo</label>
        <input type="text" id="detailNo" class="form-control" readonly style="background:#f8fafc">
      </div>
      <div class="form-group">
        <label class="form-label">テンプレート名</label>
        <input type="text" id="detailName" class="form-control" readonly style="background:#f8fafc">
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">企業名</label>
          <input type="text" id="detailCompany" class="form-control" readonly style="background:#f8fafc">
        </div>
        <div class="form-group">
          <label class="form-label">パートナー名</label>
          <input type="text" id="detailPartner" class="form-control" readonly style="background:#f8fafc">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">標準期間</label>
        <input type="text" id="detailPeriod" class="form-control" readonly style="background:#f8fafc">
      </div>
      <div class="form-group">
        <label class="form-label">作業内容</label>
        <textarea id="detailWork" class="form-control" rows="3" readonly style="background:#f8fafc"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">備考</label>
        <textarea id="detailNote" class="form-control" rows="2" readonly style="background:#f8fafc"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-outline" onclick="closeModal('viewTemplateModal')">閉じる</button>
      <button type="button" id="createBtnInDetail" class="btn btn-success">このテンプレートから案件作成</button>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script>
  const DT = window.ProtoDataTable;
  const SCREEN_KEY = 'base_projects';
  const listState = { sortKey: 'template_no', sortOrder: 'asc', filters: {} };

  const COLUMN_CATALOG = [
    { key: 'template_no', label: 'テンプレートNo' },
    { key: 'template_name', label: 'テンプレート名' },
    { key: 'company_name', label: '企業名' },
    { key: 'partner_name', label: 'パートナー名' },
    { key: 'standard_period', label: '標準期間' },
    { key: 'status', label: 'ステータス' },
  ];

  const DEFAULT_LAYOUT = {
    columns: [
      'template_no',
      'template_name',
      'company_name',
      'partner_name',
      'standard_period',
      'status',
    ],
    hidden: [],
  };

  const templates = {
    'TPL-2026-001': {
      id: 'TPL-2026-001',
      template_no: 'TPL-2026-001',
      template_name: '【定期便】首都圏ルート配送標準モジュール',
      company_name: '株式会社ヤマト運送',
      partner_name: '東京トランスポート',
      standard_period: '12ヶ月 (通年)',
      status: '有効',
      work: '毎朝7:00発、指定ルート配送（1日8店舗巡回）',
      note: '定番案件用テンプレート。年間契約の基本モデルです。',
    },
    'TPL-2026-002': {
      id: 'TPL-2026-002',
      template_no: 'TPL-2026-002',
      template_name: '【スポット】緊急チャーター便・急送便',
      company_name: '佐川ロジスティクス株式会社',
      partner_name: '山田配送サービス',
      standard_period: '1ヶ月 (スポット)',
      status: '有効',
      work: '受注後2時間以内の集荷および即日指定先納品作業',
      note: '急便・深夜対応可。単価設定は残業・休日手当適用。',
    },
    'TPL-2026-003': {
      id: 'TPL-2026-003',
      template_no: 'TPL-2026-003',
      template_name: '【宅配】城東エリアラストワンマイル配送',
      company_name: 'C配送サービス',
      partner_name: '関東陸運',
      standard_period: '6ヶ月',
      status: '有効',
      work: '個人宅宛小型荷物配送（1日約100〜120個目安）',
      note: '夜間再配達への柔軟な対応が求められる案件パターンです。',
    },
    'TPL-2026-004': {
      id: 'TPL-2026-004',
      template_no: 'TPL-2026-004',
      template_name: '【旧版】倉庫間移動・夜間転送便',
      company_name: '山田運送',
      partner_name: '鈴木ドライバー',
      standard_period: '3ヶ月',
      status: '無効',
      work: '22:00〜翌6:00の拠点間定期荷物搬送作業',
      note: '旧規約に基づくテンプレート。現在は運用停止中。',
    },
  };

  function getLayout() {
    return DT.loadLayout(SCREEN_KEY) || DEFAULT_LAYOUT;
  }

  function renderTemplateList() {
    const rows = Object.values(templates);
    const table = DT.renderTable({
      screenKey: SCREEN_KEY,
      columns: COLUMN_CATALOG,
      rows,
      layout: getLayout(),
      sortKey: listState.sortKey,
      sortOrder: listState.sortOrder,
      filters: listState.filters,
      tableId: 'templateTable',
      renderHtml: (row, col) => {
        if (col.key === 'template_no') {
          return `<span class="template-no">${DT.escapeHtml(row.template_no)}</span>`;
        }
        if (col.key === 'template_name') {
          return `<strong>${DT.escapeHtml(row.template_name)}</strong>`;
        }
        if (col.key === 'status') {
          return row.status === '有効'
            ? '<span class="badge badge-green">有効</span>'
            : '<span class="badge badge-gray">無効</span>';
        }
        return null;
      },
      renderActions: (row) => `
        <button type="button" class="btn btn-outline btn-sm" onclick="viewDetail('${DT.escapeHtml(row.template_no)}')">詳細</button>
        <button type="button" class="btn btn-success btn-sm" onclick="createProjectFromTemplate('${DT.escapeHtml(row.template_no)}')">案件として作成</button>`,
    });

    document.getElementById('base-projects-list-root').innerHTML = table.html;
    document.getElementById('recordCount').textContent = String(table.filteredRows.length);
    DT.bindTable('#base-projects-list-root', {
      onSort: (key) => {
        if (listState.sortKey === key) {
          listState.sortOrder = listState.sortOrder === 'asc' ? 'desc' : 'asc';
        } else {
          listState.sortKey = key;
          listState.sortOrder = 'asc';
        }
        renderTemplateList();
      },
      onFilter: (filters) => {
        listState.filters = filters;
        renderTemplateList();
      },
    });
  }

  /** 企業／パートナー管理からの遷移: query で列フィルタをセット */
  function applyCompanyQueryFilter() {
    const params = new URLSearchParams(location.search);
    const companyName = params.get('company_name');
    const partnerName = params.get('partner_name');
    if (!companyName && !partnerName) return;

    if (companyName) listState.filters.company_name = companyName;
    if (partnerName) listState.filters.partner_name = partnerName;

    const bannerHost = document.getElementById('queryFilterBanner');
    if (bannerHost && !document.getElementById('companyFilterBanner')) {
      const parts = [];
      if (companyName) {
        parts.push(`企業「<strong>${DT.escapeHtml(companyName)}</strong>」`);
      }
      if (partnerName) {
        parts.push(`パートナー「<strong>${DT.escapeHtml(partnerName)}</strong>」`);
      }
      const banner = document.createElement('div');
      banner.id = 'companyFilterBanner';
      banner.className = 'alert alert-info';
      banner.style.marginBottom = '12px';
      banner.innerHTML = `${parts.join(' / ')}で絞り込み中（他画面からの遷移）
        <a href="03_company.html" style="margin-left:12px;">企業管理へ戻る</a>
        <a href="05_base_project.html" style="margin-left:8px;">絞り込み解除</a>`;
      bannerHost.appendChild(banner);
    }
  }

  function openAddTemplateModal() {
    document.getElementById('addTemplateForm').reset();
    openModal('addTemplateModal');
  }

  function handleSaveTemplate(e) {
    e.preventDefault();
    const name = document.getElementById('formTplName').value.trim();
    const company = document.getElementById('formTplCompany').value;
    const partner = document.getElementById('formTplPartner').value;
    if (!name || !company || !partner) {
      alert('必須項目を入力してください。');
      return;
    }
    const seq = Object.keys(templates).length + 1;
    const no = `TPL-2026-${String(seq).padStart(3, '0')}`;
    templates[no] = {
      id: no,
      template_no: no,
      template_name: name,
      company_name: company,
      partner_name: partner,
      standard_period: document.getElementById('formTplPeriod').value,
      status: '有効',
      work: document.getElementById('formTplWork').value,
      note: document.getElementById('formTplNote').value,
    };
    closeModal('addTemplateModal');
    document.getElementById('addTemplateForm').reset();
    renderTemplateList();
    showToast('基本案件テンプレートを作成しました', 'success');
  }

  function createProjectFromTemplate(tplNo) {
    const t = templates[tplNo];
    if (!t) return;
    confirmAction(`テンプレート「${t.template_name}」を元に新規案件を作成しますか？`, () => {
      showToast('案件が正常に作成されました。案件管理画面へ反映されます。', 'success');
      setTimeout(() => {
        location.href = '06_project.html';
      }, 1200);
    });
  }

  function viewDetail(no) {
    const t = templates[no];
    if (!t) return;
    document.getElementById('detailNo').value = t.template_no;
    document.getElementById('detailName').value = t.template_name;
    document.getElementById('detailCompany').value = t.company_name;
    document.getElementById('detailPartner').value = t.partner_name;
    document.getElementById('detailPeriod').value = t.standard_period;
    document.getElementById('detailWork').value = t.work || '';
    document.getElementById('detailNote').value = t.note || '';

    document.getElementById('createBtnInDetail').onclick = () => {
      closeModal('viewTemplateModal');
      createProjectFromTemplate(t.template_no);
    };

    openModal('viewTemplateModal');
  }

  document.addEventListener('DOMContentLoaded', () => {
    if (!DT.loadLayout(SCREEN_KEY)) {
      DT.saveLayout(SCREEN_KEY, DEFAULT_LAYOUT);
    }
    applyCompanyQueryFilter();
    renderTemplateList();
  });
</script>
</body>
</html>
