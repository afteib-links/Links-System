<!DOCTYPE html>

<head>

<title>企業管理 - LinksSys</title>

<style>
  .company-code {
    font-family: monospace;
    font-weight: 600;
    color: var(--color-primary);
    background: #eff6ff;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 12px;
  }
  .section-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--color-text);
    margin: 20px 0 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--color-border);
  }
  .section-title:first-child { margin-top: 0; }
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 20px 0 12px;
  }
  .section-head .section-title { margin: 0; border: none; padding: 0; }
  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px 16px;
  }
  .form-grid .full { grid-column: 1 / -1; }
  .form-grid label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--color-text-muted);
    margin-bottom: 4px;
  }
  .page-header-left {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .detail-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--color-border);
  }
</style>
</head>

<div class="main-content">
  <!-- 一覧 -->
  <div id="panel-list">
    <header class="page-header">
      <h1 class="page-title">企業管理</h1>
      <button type="button" class="btn btn-primary" onclick="openNewCompany()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        新規企業登録
      </button>
    </header>
    <div class="page-body">
      <div class="list-meta">
        <span>該当件数: <strong id="recordCount">0</strong> 件</span>
        <span>表示列・順序は UIビルダーで変更（本システムの <code>user_screen_layouts</code> 相当）</span>
      </div>
      <div id="companies-list-root"></div>
    </div>
  </div>

  <!-- 詳細・編集（フルページ） -->
  <div id="panel-detail" class="hidden">
    <header class="page-header">
      <div class="page-header-left">
        <button type="button" class="btn btn-outline" onclick="showListPanel()">← 一覧へ戻る</button>
        <h1 class="page-title" id="detailTitle">企業編集</h1>
      </div>
      <div class="flex gap-2">
        <button type="button" class="btn btn-outline" onclick="goRelatedFromDetail('base')">基本案件管理へ</button>
        <button type="button" class="btn btn-outline" onclick="goRelatedFromDetail('project')">案件管理へ</button>
      </div>
    </header>
    <div class="page-body">
      <form id="companyForm" onsubmit="event.preventDefault(); saveCompany();">
        <h3 class="section-title">基本情報・銀行情報</h3>
        <div class="form-grid mb-4">
          <div>
            <label>企業No</label>
            <input type="text" class="form-control" id="f_company_id" readonly>
          </div>
          <div>
            <label>ステータス</label>
            <select class="form-control" id="f_status">
              <option value="ACTIVE">取引中</option>
              <option value="INACTIVE">休止中</option>
            </select>
          </div>
          <div>
            <label>事業所No</label>
            <input type="text" class="form-control" id="f_office_no" disabled placeholder="保存時に自動採番">
          </div>
          <div>
            <label>事業所名</label>
            <input type="text" class="form-control" id="f_office_name" placeholder="任意（入力なし可）">
          </div>
          <div>
            <label>企業名（必須）</label>
            <input type="text" class="form-control" id="f_company_name" required>
          </div>
          <div>
            <label>企業名カナ</label>
            <input type="text" class="form-control" id="f_company_name_kana">
          </div>
          <div>
            <label>郵便番号</label>
            <input type="text" class="form-control" id="f_zip_code" placeholder="100-0001">
          </div>
          <div class="full">
            <label>住所</label>
            <input type="text" class="form-control" id="f_address">
          </div>
          <div>
            <label>連絡先</label>
            <input type="text" class="form-control" id="f_contact" placeholder="03-0000-0000">
          </div>
          <div>
            <label>FAX</label>
            <input type="text" class="form-control" id="f_fax">
          </div>
          <div>
            <label>契約担当者</label>
            <input type="text" class="form-control" id="f_contract_manager">
          </div>
          <div>
            <label>弊社担当者</label>
            <input type="text" class="form-control" id="f_our_manager" list="staffList" placeholder="マスター参照＋手入力可">
          </div>
          <div>
            <label>弊社契約担当者</label>
            <input type="text" class="form-control" id="f_our_contract_manager" list="staffList" placeholder="マスター参照＋手入力可">
          </div>
          <div>
            <label>稼働形態</label>
            <select class="form-control" id="f_work_mode_code">
              <option value="">（未選択）</option>
              <option value="exclusive">専属</option>
              <option value="spot">スポット</option>
              <option value="mixed">混載</option>
            </select>
          </div>
          <div>
            <label>基本締日</label>
            <select class="form-control" id="f_closing_date_code">
              <option value="">（未選択）</option>
              <option value="end">末日</option>
              <option value="d20">20日</option>
              <option value="d15">15日</option>
              <option value="d10">10日</option>
            </select>
          </div>
          <div>
            <label>基本支払日</label>
            <select class="form-control" id="f_payment_date_code">
              <option value="">（未選択）</option>
              <option value="next_end">翌月末</option>
              <option value="next_20">翌月20日</option>
              <option value="next_15">翌月15日</option>
              <option value="next2_5">翌々月5日</option>
            </select>
          </div>
          <div>
            <label>請求書送付方法</label>
            <select class="form-control" id="f_invoice_send_method">
              <option value="">（未選択）</option>
              <option value="email_pdf">メールPDF</option>
              <option value="post">郵送</option>
              <option value="fax">FAX</option>
            </select>
          </div>
          <div class="full">
            <label>請求書送付先住所</label>
            <input type="text" class="form-control" id="f_invoice_send_address">
          </div>
          <div>
            <label>基本契約日</label>
            <input type="date" class="form-control" id="f_contract_date">
          </div>
          <div class="full">
            <label>業務内容および付帯作業</label>
            <textarea class="form-control" id="f_business_content" rows="3"></textarea>
          </div>
          <div>
            <label>銀行名</label>
            <input type="text" class="form-control" id="f_bank_name">
          </div>
          <div>
            <label>支店名</label>
            <input type="text" class="form-control" id="f_branch_name">
          </div>
          <div>
            <label>口座種別</label>
            <select class="form-control" id="f_deposit_type">
              <option value="">（未選択）</option>
              <option value="ordinary">普通</option>
              <option value="checking">当座</option>
              <option value="savings">貯蓄</option>
            </select>
          </div>
          <div>
            <label>口座番号</label>
            <input type="text" class="form-control" id="f_account_number">
          </div>
          <div>
            <label>口座名義</label>
            <input type="text" class="form-control" id="f_account_name">
          </div>
        </div>
        <datalist id="staffList">
          <option value="佐藤 健太"></option>
          <option value="鈴木 一郎"></option>
          <option value="田中 太郎"></option>
          <option value="高橋 花子"></option>
        </datalist>

        <div class="section-head">
          <h3 class="section-title">請求先情報</h3>
          <button type="button" class="btn btn-ghost btn-sm" onclick="openBillingModal(null)">＋ 請求先を追加</button>
        </div>
        <div class="table-wrap mb-4" id="billings-mini"></div>

        <div class="section-head">
          <h3 class="section-title">車両情報</h3>
          <button type="button" class="btn btn-ghost btn-sm" onclick="openVehicleModal(null)">＋ 車両を追加</button>
        </div>
        <div class="table-wrap mb-4" id="vehicles-mini"></div>

        <div class="section-head">
          <h3 class="section-title">担当履歴</h3>
          <button type="button" class="btn btn-ghost btn-sm" onclick="openPeriodModal(null)">＋ 期間追加</button>
        </div>
        <div class="table-wrap mb-4" id="periods-mini"></div>

        <div class="detail-actions">
          <button type="submit" class="btn btn-primary">保存</button>
          <button type="button" class="btn btn-outline" onclick="showListPanel()">一覧へ戻る</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- 請求先モーダル -->
<div class="modal-overlay hidden" id="billingModal">
  <div class="modal" style="max-width:480px">
    <div class="modal-header">
      <h3 class="modal-title">請求先</h3>
      <button type="button" class="modal-close" onclick="closeModal('billingModal')">&times;</button>
    </div>
    <div class="modal-body form-grid">
      <div class="full"><label>印字名称</label><input class="form-control" id="m_billing_name"></div>
      <div class="full"><label>住所</label><input class="form-control" id="m_billing_address"></div>
      <div><label>電話</label><input class="form-control" id="m_billing_phone"></div>
      <div><label>取り纏めNo</label><input class="form-control" id="m_billing_summary"></div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-outline" onclick="closeModal('billingModal')">キャンセル</button>
      <button type="button" class="btn btn-primary" onclick="saveBillingModal()">保存</button>
    </div>
  </div>
</div>

<!-- 車両モーダル -->
<div class="modal-overlay hidden" id="vehicleModal">
  <div class="modal" style="max-width:480px">
    <div class="modal-header">
      <h3 class="modal-title">車両</h3>
      <button type="button" class="modal-close" onclick="closeModal('vehicleModal')">&times;</button>
    </div>
    <div class="modal-body form-grid">
      <div><label>名称</label><input class="form-control" id="m_vehicle_name"></div>
      <div><label>番号</label><input class="form-control" id="m_vehicle_number"></div>
      <div><label>車検期限</label><input type="date" class="form-control" id="m_inspection"></div>
      <div><label>保険期限</label><input type="date" class="form-control" id="m_insurance"></div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-outline" onclick="closeModal('vehicleModal')">キャンセル</button>
      <button type="button" class="btn btn-primary" onclick="saveVehicleModal()">保存</button>
    </div>
  </div>
</div>

<!-- 担当履歴モーダル -->
<div class="modal-overlay hidden" id="periodModal">
  <div class="modal" style="max-width:480px">
    <div class="modal-header">
      <h3 class="modal-title">担当期間</h3>
      <button type="button" class="modal-close" onclick="closeModal('periodModal')">&times;</button>
    </div>
    <div class="modal-body form-grid">
      <div>
        <label>種別</label>
        <select class="form-control" id="m_role_type">
          <option value="our_manager">営業担当</option>
          <option value="our_contract_manager">契約担当</option>
        </select>
      </div>
      <div><label>氏名</label><input class="form-control" id="m_period_name" list="staffList"></div>
      <div><label>開始</label><input type="date" class="form-control" id="m_period_start"></div>
      <div><label>終了</label><input type="date" class="form-control" id="m_period_end"></div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-outline" onclick="closeModal('periodModal')">キャンセル</button>
      <button type="button" class="btn btn-primary" onclick="savePeriodModal()">保存</button>
    </div>
  </div>
</div>

      office_no: '003', office_name: '',
      company_name: '日本通運ファシリティー株式会社', company_name_kana: 'ニッポンツウウンファシリティー',
      contact: '03-5555-4321', fax: '03-5555-4322',
      our_manager: '田中 太郎', work_mode_code: 'exclusive', closing_date_code: 'd15', payment_date_code: 'next2_5',
      invoice_send_method: 'email_pdf', contract_date: '2024-01-10',
      business_content: '精密機械輸送、イベント搬入作業',
      base_project_count: 5, active_project_count: 4,
      billings: [], vehicles: [], manager_periods: [],
    },
    'COMP-004': {
      ...emptyCompany('COMP-004'),
      office_no: '004', office_name: '名古屋',
      company_name: '西濃エキスプレス株式会社', company_name_kana: 'セイノウエキスプレス',
      contact: '052-111-2222', our_manager: '佐藤 健太',
      work_mode_code: 'exclusive', closing_date_code: 'end', payment_date_code: 'next_15',
      invoice_send_method: 'fax', contract_date: '2021-06-01',
      status: 'INACTIVE', status_label: '休止中',
      business_content: '定期大型案件（現在休止中）',
      base_project_count: 1, active_project_count: 0,
      billings: [], vehicles: [], manager_periods: [],
    },
    'COMP-005': {
      ...emptyCompany('COMP-005'),
      office_no: '005', office_name: '川崎物流センター',
      company_name: 'エクスプレス・ライナー有限会社', company_name_kana: 'エクスプレスライナー',
      contact: '03-3333-7777', our_manager: '高橋 花子',
      work_mode_code: 'mixed', closing_date_code: 'end', payment_date_code: 'next_end',
      invoice_send_method: 'email_pdf', contract_date: '2023-09-20',
      business_content: '食品チャーター便、冷凍冷蔵車案件',
      base_project_count: 3, active_project_count: 3,
      billings: [], vehicles: [], manager_periods: [],
    },
  };

  function getLayout() {
    return DT.loadLayout(SCREEN_KEY) || DEFAULT_LAYOUT;
  }

  function showListPanel() {
    document.getElementById('panel-detail').classList.add('hidden');
    document.getElementById('panel-list').classList.remove('hidden');
    currentEditCode = null;
    renderCompanyList();
  }

  function showDetailPanel() {
    document.getElementById('panel-list').classList.add('hidden');
    document.getElementById('panel-detail').classList.remove('hidden');
  }

  function renderCompanyList() {
    const rows = Object.values(companies);
    const table = DT.renderTable({
      screenKey: SCREEN_KEY,
      columns: COLUMN_CATALOG,
      rows,
      layout: getLayout(),
      sortKey: listState.sortKey,
      sortOrder: listState.sortOrder,
      filters: listState.filters,
      tableId: 'companyTable',
      renderHtml: (row, col) => {
        if (col.key === 'company_id') return `<span class="company-code">${DT.escapeHtml(row.company_id)}</span>`;
        if (col.key === 'company_name') {
          return `<div class="font-bold">${DT.escapeHtml(row.company_name)}</div>
            <div class="text-sm text-muted">${DT.escapeHtml(row.company_name_kana || '')}</div>`;
        }
        if (col.key === 'status_label') {
          return row.status === 'ACTIVE'
            ? '<span class="badge badge-green">取引中</span>'
            : '<span class="badge badge-gray">休止中</span>';
        }
        if (col.key === 'active_project_count') return `<strong>${Number(row.active_project_count) || 0}</strong>`;
        return null;
      },
      renderActions: (c) => `
        <button type="button" class="btn btn-outline btn-sm" onclick="openEditCompany('${c.company_id}')">詳細／編集</button>
        <button type="button" class="btn btn-ghost btn-sm" onclick="goRelated('${c.company_id}', 'base')">基本案件</button>
        <button type="button" class="btn btn-ghost btn-sm" onclick="goRelated('${c.company_id}', 'project')">案件</button>
        <button type="button" class="btn btn-ghost btn-sm" style="color:var(--color-danger)" onclick="deleteCompany('${c.company_id}', '${DT.escapeHtml(c.company_name)}')">削除</button>`,
    });
    document.getElementById('companies-list-root').innerHTML = table.html;
    document.getElementById('recordCount').textContent = String(table.filteredRows.length);
    DT.bindTable('#companies-list-root', {
      onSort: (key) => {
        if (listState.sortKey === key) listState.sortOrder = listState.sortOrder === 'asc' ? 'desc' : 'asc';
        else { listState.sortKey = key; listState.sortOrder = 'asc'; }
        renderCompanyList();
      },
      onFilter: (filters) => { listState.filters = filters; renderCompanyList(); },
    });
  }

  function fillForm(c) {
    const set = (id, v) => { document.getElementById(id).value = v ?? ''; };
    set('f_company_id', c.company_id);
    set('f_status', c.status || 'ACTIVE');
    set('f_office_no', c.office_no);
    set('f_office_name', c.office_name);
    set('f_company_name', c.company_name);
    set('f_company_name_kana', c.company_name_kana);
    set('f_zip_code', c.zip_code);
    set('f_address', c.address);
    set('f_contact', c.contact);
    set('f_fax', c.fax);
    set('f_contract_manager', c.contract_manager);
    set('f_our_manager', c.our_manager);
    set('f_our_contract_manager', c.our_contract_manager);
    set('f_work_mode_code', c.work_mode_code);
    set('f_closing_date_code', c.closing_date_code);
    set('f_payment_date_code', c.payment_date_code);
    set('f_invoice_send_method', c.invoice_send_method);
    set('f_invoice_send_address', c.invoice_send_address);
    set('f_contract_date', c.contract_date);
    set('f_business_content', c.business_content);
    set('f_bank_name', c.bank_name);
    set('f_branch_name', c.branch_name);
    set('f_deposit_type', c.deposit_type);
    set('f_account_number', c.account_number);
    set('f_account_name', c.account_name);
    detailBillings = (c.billings || []).map((x) => ({ ...x }));
    detailVehicles = (c.vehicles || []).map((x) => ({ ...x }));
    detailPeriods = (c.manager_periods || []).map((x) => ({ ...x }));
    refreshChildTables();
  }

  function openNewCompany() {
    currentEditCode = null;
    const id = 'COMP-' + String(Object.keys(companies).length + 1).padStart(3, '0');
    document.getElementById('detailTitle').textContent = '新規企業登録';
    fillForm(emptyCompany(id));
    document.getElementById('f_company_id').value = id;
    document.getElementById('f_office_no').placeholder = '保存時に自動採番';
    showDetailPanel();
  }

  function openEditCompany(code) {
    const c = companies[code];
    if (!c) return;
    currentEditCode = code;
    document.getElementById('detailTitle').textContent = `企業編集（${c.company_id}）`;
    fillForm(c);
    showDetailPanel();
  }

  function refreshChildTables() {
    const bRows = detailBillings.map((b, idx) => `
      <tr>
        <td>${DT.escapeHtml(b.billing_print_name || '-')}</td>
        <td>${DT.escapeHtml(b.billing_address || '-')}</td>
        <td>${DT.escapeHtml(b.billing_phone || '-')}</td>
        <td>${DT.escapeHtml(b.billing_summary_no || '-')}</td>
        <td>
          <button type="button" class="btn btn-ghost btn-sm" onclick="openBillingModal(${idx})">編集</button>
          <button type="button" class="btn btn-ghost btn-sm" style="color:var(--color-danger)" onclick="detailBillings.splice(${idx},1);refreshChildTables()">削除</button>
        </td>
      </tr>`).join('');
    document.getElementById('billings-mini').innerHTML = `<table class="data-table data-table-compact"><thead><tr><th>印字名称</th><th>住所</th><th>電話</th><th>取り纏めNo</th><th>操作</th></tr></thead>
      <tbody>${bRows || '<tr><td colspan="5">請求先はまだありません</td></tr>'}</tbody></table>`;

    const vRows = detailVehicles.map((v, idx) => `
      <tr>
        <td>${DT.escapeHtml(v.vehicle_name || '-')}</td>
        <td>${DT.escapeHtml(v.vehicle_number || '-')}</td>
        <td>${DT.escapeHtml(v.inspection_expiry_date || '-')}</td>
        <td>${DT.escapeHtml(v.insurance_expiry_date || '-')}</td>
        <td>
          <button type="button" class="btn btn-ghost btn-sm" onclick="openVehicleModal(${idx})">編集</button>
          <button type="button" class="btn btn-ghost btn-sm" style="color:var(--color-danger)" onclick="detailVehicles.splice(${idx},1);refreshChildTables()">削除</button>
        </td>
      </tr>`).join('');
    document.getElementById('vehicles-mini').innerHTML = `<table class="data-table data-table-compact"><thead><tr><th>名称</th><th>番号</th><th>車検期限</th><th>保険期限</th><th>操作</th></tr></thead>
      <tbody>${vRows || '<tr><td colspan="5">車両はまだありません</td></tr>'}</tbody></table>`;

    const roleLabel = (t) => (t === 'our_contract_manager' ? '契約担当' : '営業担当');
    const pRows = detailPeriods.map((p, idx) => `
      <tr>
        <td>${DT.escapeHtml(roleLabel(p.role_type))}</td>
        <td>${DT.escapeHtml(p.name_or_user || '-')}</td>
        <td>${DT.escapeHtml(p.start_date || '-')}</td>
        <td>${DT.escapeHtml(p.end_date || '〜')}</td>
        <td>
          <button type="button" class="btn btn-ghost btn-sm" onclick="openPeriodModal(${idx})">編集</button>
          <button type="button" class="btn btn-ghost btn-sm" style="color:var(--color-danger)" onclick="detailPeriods.splice(${idx},1);refreshChildTables()">削除</button>
        </td>
      </tr>`).join('');
    document.getElementById('periods-mini').innerHTML = `<table class="data-table data-table-compact"><thead><tr><th>種別</th><th>氏名</th><th>開始</th><th>終了</th><th>操作</th></tr></thead>
      <tbody>${pRows || '<tr><td colspan="5">担当履歴はまだありません</td></tr>'}</tbody></table>`;
  }

  function openBillingModal(idx) {
    billingEditIdx = idx;
    const b = idx == null ? {} : detailBillings[idx] || {};
    document.getElementById('m_billing_name').value = b.billing_print_name || '';
    document.getElementById('m_billing_address').value = b.billing_address || '';
    document.getElementById('m_billing_phone').value = b.billing_phone || '';
    document.getElementById('m_billing_summary').value = b.billing_summary_no || '';
    openModal('billingModal');
  }
  function saveBillingModal() {
    const row = {
      billing_print_name: document.getElementById('m_billing_name').value,
      billing_address: document.getElementById('m_billing_address').value,
      billing_phone: document.getElementById('m_billing_phone').value,
      billing_summary_no: document.getElementById('m_billing_summary').value,
    };
    if (billingEditIdx == null) detailBillings.push(row);
    else detailBillings[billingEditIdx] = row;
    closeModal('billingModal');
    refreshChildTables();
  }

  function openVehicleModal(idx) {
    vehicleEditIdx = idx;
    const v = idx == null ? {} : detailVehicles[idx] || {};
    document.getElementById('m_vehicle_name').value = v.vehicle_name || '';
    document.getElementById('m_vehicle_number').value = v.vehicle_number || '';
    document.getElementById('m_inspection').value = v.inspection_expiry_date || '';
    document.getElementById('m_insurance').value = v.insurance_expiry_date || '';
    openModal('vehicleModal');
  }
  function saveVehicleModal() {
    const row = {
      vehicle_name: document.getElementById('m_vehicle_name').value,
      vehicle_number: document.getElementById('m_vehicle_number').value,
      inspection_expiry_date: document.getElementById('m_inspection').value,
      insurance_expiry_date: document.getElementById('m_insurance').value,
    };
    if (vehicleEditIdx == null) detailVehicles.push(row);
    else detailVehicles[vehicleEditIdx] = row;
    closeModal('vehicleModal');
    refreshChildTables();
  }

  function openPeriodModal(idx) {
    periodEditIdx = idx;
    const p = idx == null ? {} : detailPeriods[idx] || {};
    document.getElementById('m_role_type').value = p.role_type || 'our_manager';
    document.getElementById('m_period_name').value = p.name_or_user || '';
    document.getElementById('m_period_start').value = p.start_date || '';
    document.getElementById('m_period_end').value = p.end_date || '';
    openModal('periodModal');
  }
  function savePeriodModal() {
    const row = {
      role_type: document.getElementById('m_role_type').value,
      name_or_user: document.getElementById('m_period_name').value,
      start_date: document.getElementById('m_period_start').value,
      end_date: document.getElementById('m_period_end').value,
    };
    if (periodEditIdx == null) detailPeriods.push(row);
    else detailPeriods[periodEditIdx] = row;
    closeModal('periodModal');
    refreshChildTables();
  }

  function saveCompany() {
    const name = document.getElementById('f_company_name').value.trim();
    if (!name) { alert('企業名を入力してください。'); return; }
    const code = document.getElementById('f_company_id').value;
    const prev = companies[code] || emptyCompany(code);
    const status = document.getElementById('f_status').value;
    const isNew = !currentEditCode && !companies[code];
    companies[code] = {
      ...prev,
      company_id: code,
      office_no: prev.office_no || String(Object.keys(companies).length).padStart(3, '0'),
      office_name: document.getElementById('f_office_name').value,
      company_name: name,
      company_name_kana: document.getElementById('f_company_name_kana').value,
      zip_code: document.getElementById('f_zip_code').value,
      address: document.getElementById('f_address').value,
      contact: document.getElementById('f_contact').value,
      fax: document.getElementById('f_fax').value,
      contract_manager: document.getElementById('f_contract_manager').value,
      our_manager: document.getElementById('f_our_manager').value,
      our_contract_manager: document.getElementById('f_our_contract_manager').value,
      work_mode_code: document.getElementById('f_work_mode_code').value,
      closing_date_code: document.getElementById('f_closing_date_code').value,
      payment_date_code: document.getElementById('f_payment_date_code').value,
      invoice_send_method: document.getElementById('f_invoice_send_method').value,
      invoice_send_address: document.getElementById('f_invoice_send_address').value,
      contract_date: document.getElementById('f_contract_date').value,
      business_content: document.getElementById('f_business_content').value,
      bank_name: document.getElementById('f_bank_name').value,
      branch_name: document.getElementById('f_branch_name').value,
      deposit_type: document.getElementById('f_deposit_type').value,
      account_number: document.getElementById('f_account_number').value,
      account_name: document.getElementById('f_account_name').value,
      status,
      status_label: status === 'ACTIVE' ? '取引中' : '休止中',
      billings: detailBillings.map((x) => ({ ...x })),
      vehicles: detailVehicles.map((x) => ({ ...x })),
      manager_periods: detailPeriods.map((x) => ({ ...x })),
    };
    if (isNew && !companies[code].office_no) {
      companies[code].office_no = String(Object.keys(companies).length).padStart(3, '0');
    }
    currentEditCode = code;
    showToast(isNew ? '新規企業を登録しました' : '企業情報を更新しました', 'success');
    showListPanel();
  }

  function deleteCompany(code, name) {
    confirmAction(`「${name} (${code})」を削除してもよろしいですか？`, () => {
      delete companies[code];
      renderCompanyList();
      showToast('企業情報を削除しました', 'info');
    });
  }

  function goRelated(companyId, kind) {
    const c = companies[companyId];
    if (!c) return;
    const page = kind === 'base' ? '05_base_project.html' : '06_project.html';
    const params = new URLSearchParams({ company_id: c.company_id, company_name: c.company_name });
    location.href = `${page}?${params.toString()}`;
  }
  function goRelatedFromDetail(kind) {
    const code = currentEditCode || document.getElementById('f_company_id').value;
    if (!code || !companies[code]) {
      showToast('先に企業を保存してください', 'warning');
      return;
    }
    goRelated(code, kind);
  }

  document.addEventListener('DOMContentLoaded', () => {
    if (!DT.loadLayout(SCREEN_KEY)) DT.saveLayout(SCREEN_KEY, DEFAULT_LAYOUT);
    renderCompanyList();
  });
</script>
</body>
</html>
